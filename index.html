<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIMS5702 签到题互动学习</title>
<style>
:root {
  --bg: #f6f7f9; --card: #fff; --text: #1f2328; --muted: #656d76; --line: #d8dee4;
  --accent: #2f6feb; --accent-soft: #e8f0fe;
  --ok: #1a7f37; --ok-soft: #e6f4ea; --bad: #cf222e; --bad-soft: #fdecec;
  --warn: #9a6700; --warn-soft: #fff8e1;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117; --card: #161b22; --text: #e6edf3; --muted: #8d96a0; --line: #30363d;
    --accent: #4c8dff; --accent-soft: #15233d;
    --ok: #3fb950; --ok-soft: #12261a; --bad: #f85149; --bad-soft: #2d1416;
    --warn: #d29922; --warn-soft: #2a2110;
  }
}
* { box-sizing: border-box; }
body { margin: 0; font: 15px/1.65 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .92em; background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; }
button { font: inherit; cursor: pointer; }

.layout { display: grid; grid-template-columns: 290px 1fr; min-height: 100vh; }
aside { background: var(--card); border-right: 1px solid var(--line); padding: 18px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
aside h1 { font-size: 17px; margin: 0 0 4px; }
.overall { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 14px; }
.bar > div { height: 100%; background: var(--ok); width: 0; transition: width .3s; }
.sec-title { font-weight: 600; font-size: 13px; margin: 14px 0 4px; color: var(--muted); }
.nav-item { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: none; color: var(--text); padding: 5px 8px; border-radius: 6px; font-size: 13.5px; }
.nav-item:hover { background: var(--accent-soft); }
.nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.dot { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--line); flex: none; }
.dot.ok { background: var(--ok); border-color: var(--ok); }
.dot.bad { background: var(--bad); border-color: var(--bad); }
.dot.partial { background: var(--warn); border-color: var(--warn); }
.side-actions { margin-top: 18px; display: flex; flex-direction: column; gap: 6px; }
.side-actions button { border: 1px solid var(--line); background: var(--card); color: var(--muted); padding: 6px; border-radius: 6px; font-size: 13px; }

main { padding: 26px 32px 80px; max-width: 1240px; width: 100%; }
.crumb { color: var(--muted); font-size: 13px; }
.q-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 4px 0 18px; }
.q-head h2 { margin: 0; font-size: 22px; }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); }

.stepper { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
.step { font-size: 13px; padding: 4px 12px; border-radius: 14px; border: 1px solid var(--line); color: var(--muted); background: var(--card); }
.step.on { border-color: var(--accent); color: var(--accent); }
.step.done { border-color: var(--ok); color: var(--ok); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px 22px; margin-bottom: 18px; }
.card h3 { margin: 0 0 10px; font-size: 16px; }
.know p { margin: 6px 0; }
.know ul, .know ol { margin: 4px 0 8px; padding-left: 22px; }
.know li { margin: 2px 0; }
.primary { background: var(--accent); color: #fff; border: 0; padding: 8px 18px; border-radius: 6px; margin-top: 10px; }
.primary:hover { filter: brightness(1.08); }
.ghost { background: none; border: 1px solid var(--line); color: var(--text); padding: 7px 14px; border-radius: 6px; }

.quiz { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.quiz.unanswered { grid-template-columns: minmax(0, 1fr); }
.quiz .panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px 22px; }
.label { font-size: 12px; font-weight: 600; letter-spacing: .03em; color: var(--accent); text-transform: uppercase; margin-bottom: 6px; }
.stem { margin: 0 0 12px; }
.opt { display: flex; gap: 10px; width: 100%; text-align: left; border: 1.5px solid var(--line); background: var(--card); color: var(--text); padding: 9px 12px; border-radius: 8px; margin: 7px 0; transition: border-color .15s, background .15s; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.opt:disabled { cursor: default; }
.opt .k { font-weight: 700; flex: none; width: 18px; }
.opt.correct { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.dim { opacity: .6; }
.verdict { font-weight: 700; margin-bottom: 8px; font-size: 16px; }
.verdict.ok { color: var(--ok); }
.verdict.bad { color: var(--bad); }
.explain { animation: fade .25s ease; }
.explain p { margin: 6px 0; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 26px; }
.summary { text-align: center; }
.summary .big { font-size: 40px; font-weight: 700; margin: 6px 0; }
.wrong-list { text-align: left; margin-top: 16px; }

.menu-btn { display: none; }
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  aside { position: fixed; left: 0; top: 0; width: 280px; z-index: 20; transform: translateX(-100%); transition: transform .2s; box-shadow: 2px 0 12px rgba(0,0,0,.2); }
  aside.open { transform: none; }
  .menu-btn { display: inline-block; margin-bottom: 10px; }
  main { padding: 16px 14px 60px; }
  .quiz { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>
<body>
<div class="layout">
  <aside id="side"></aside>
  <main id="main"></main>
</div>
<script>
const DATA = [{"id": "w1", "title": "Week 1", "subtitle": "数据规模与数值表示（float16 / bfloat16 / int8 / 显存估算）", "questions": [{"t": "Number of samples", "q": "What is the memory complexity of Deep Learning relative to the number of samples N, compared to SVM's O(N^2)?", "opts": ["O(1)", "O(logN)", "O(N)", "O(NlogN)"], "ans": 0, "know": "**核 SVM 为什么是 O(N²)**\n- 核方法需要 N×N 的 Gram 矩阵 K[i,j] = k(x_i, x_j)，存储就是 O(N²)，训练时间通常在 O(N²)~O(N³)。\n- 样本一多（例如百万级），矩阵根本放不进内存。\n\n**深度学习为什么是 O(1)**\n- 用 mini-batch SGD 训练：每一步只把一个 batch（大小 B）和模型参数放进内存。\n- 数据集可以从磁盘流式读取，所需内存和总样本数 N 无关，所以相对 N 是 O(1)。\n- 内存主要由 **参数量** 和 **batch size** 决定。", "exp": "答案 **A. O(1)**。深度学习按 mini-batch 训练，内存只与 batch 大小和参数量有关，不随样本总数 N 增长；SVM 则要存 N×N 核矩阵。", "prac": [{"q": "核 SVM（kernel SVM）训练的时间复杂度相对样本数 N 大约是？", "opts": ["O(N)", "O(N²) ~ O(N³)", "O(log N)", "O(1)"], "ans": 1, "exp": "核 SVM 需要构造并求解 N×N 的核矩阵二次规划问题，时间约 O(N²)~O(N³)。这也是它难以扩展到大数据集的原因。"}, {"q": "用 mini-batch SGD 训练神经网络时，每一步激活值（activations）占用的显存主要随什么增长？", "opts": ["数据集样本总数 N", "N²", "batch size B", "log N"], "ans": 2, "exp": "每一步只对 B 个样本做前向/反向，激活值显存 ∝ B（以及网络大小），与 N 无关。显存不够时减小 batch size 就是这个道理。"}]}, {"t": "Float16", "q": "How many exponent bits and mantissa bits are used in the IEEE half-precision (float16) format?", "opts": ["8 exponent bits and 7 mantissa bits", "8 exponent bits and 23 mantissa bits", "5 exponent bits and 10 mantissa bits", "4 exponent bits and 3 mantissa bits"], "ans": 2, "know": "**浮点数 = 符号位 + 指数位 + 尾数位**\n- 值 = (-1)^s × 1.mantissa × 2^(exponent − bias)\n- 指数位决定 **动态范围**（能表示多大/多小），尾数位决定 **精度**（有效数字）。\n\n**常见格式（符号/指数/尾数）**\n- float32：1 / 8 / 23，共 32 bit\n- float16 (IEEE half)：1 / 5 / 10，共 16 bit，最大约 65504\n- bfloat16：1 / 8 / 7，共 16 bit\n- FP8 E4M3：1 / 4 / 3；FP8 E5M2：1 / 5 / 2", "exp": "答案 **C**。float16 = 1 符号 + 5 指数 + 10 尾数。A 是 bfloat16，B 是 float32，D 是 FP8 E4M3。", "prac": [{"q": "IEEE float32 的指数位有几位？", "opts": ["5", "8", "10", "11"], "ans": 1, "exp": "float32 = 1 符号 + 8 指数 + 23 尾数。11 位指数是 float64 的。"}, {"q": "bfloat16 的指数位和尾数位分别是？", "opts": ["5 指数 + 10 尾数", "8 指数 + 23 尾数", "4 指数 + 3 尾数", "8 指数 + 7 尾数"], "ans": 3, "exp": "bfloat16 = 1 + 8 + 7。它直接截掉 float32 尾数的低 16 位，指数位保持 8 位。"}]}, {"t": "bfloat16", "q": "What primary advantage does bfloat16 offer over standard float16 during neural network training?", "opts": ["Higher numerical precision", "A wider dynamic range", "Smaller memory footprint", "Universal hardware support"], "ans": 1, "know": "**bfloat16 vs float16**\n- 两者都是 16 bit，内存占用相同（排除 C）。\n- bf16 有 8 位指数，和 float32 一样，**动态范围** 约 1e-38 ~ 3e38；fp16 只有 5 位指数，最大约 65504，很小的梯度容易下溢成 0。\n- bf16 只有 7 位尾数，**精度比 fp16 更低**（排除 A）。\n- bf16 需要较新的硬件（Ampere GPU、TPU 等），并非处处支持（排除 D）。\n\n**训练中的意义**\n- fp16 混合精度训练常需要 loss scaling 防止梯度下溢；bf16 通常不需要。", "exp": "答案 **B. 更宽的动态范围**。bf16 的指数位与 fp32 相同，不易溢出/下溢；代价是精度更低。", "prac": [{"q": "下面哪种 16 位格式的动态范围与 float32 基本相同？", "opts": ["float16", "bfloat16", "int16", "FP8 E4M3"], "ans": 1, "exp": "bfloat16 有 8 位指数，与 float32 相同，所以动态范围一致。"}, {"q": "使用 float16 混合精度训练时，为什么常常需要 loss scaling？", "opts": ["很小的梯度会因指数范围窄而下溢为 0", "float16 没有符号位", "float16 无法做乘法", "float16 占用内存比 float32 更多"], "ans": 0, "exp": "fp16 能表示的最小正规数约 6e-5，小梯度会直接变成 0。先把 loss 乘一个大系数，反向后再除回去，可以避免下溢。"}]}, {"t": "VRAM", "q": "How many total bytes of VRAM are required to store a model with 3 billion parameters using float32 precision?", "opts": ["3 billion bytes", "6 billion bytes", "12 billion bytes", "24 billion bytes"], "ans": 2, "know": "**显存估算：参数量 × 每个参数的字节数**\n- float64 = 8 B，float32 = 4 B，float16/bfloat16 = 2 B，int8 = 1 B，int4 = 0.5 B\n- 例：7B 模型 fp16 ≈ 14 GB；int4 ≈ 3.5 GB\n\n**训练比推理多很多**\n- 训练还要存梯度、优化器状态（Adam 有两个动量）以及激活值。\n- 全 fp32 + Adam：权重 4 + 梯度 4 + m 4 + v 4 = 每参数 16 B（不含激活）。", "exp": "答案 **C**。3×10⁹ 参数 × 4 字节 = 12×10⁹ 字节 ≈ 12 GB（约 11.2 GiB）。", "prac": [{"q": "一个 7B 参数的模型用 float16 存储，权重大约需要多少显存？", "opts": ["7 GB", "14 GB", "28 GB", "56 GB"], "ans": 1, "exp": "7×10⁹ × 2 B = 14×10⁹ B ≈ 14 GB。"}, {"q": "一个 1B 参数的模型用 float32 + Adam 训练（权重、梯度、Adam 的两个动量都是 fp32），不算激活值，大约需要多少显存？", "opts": ["4 GB", "8 GB", "12 GB", "16 GB"], "ans": 3, "exp": "每个参数：权重 4 + 梯度 4 + m 4 + v 4 = 16 B，1×10⁹ × 16 B = 16 GB。"}]}, {"t": "Binary representation", "q": "How is a negative integer stored in standard 8-bit signed integer (int8) representation using two's complement?", "opts": ["Via binary overflow relative to 256", "By setting only the least significant bit to 1", "By multiplying the positive bit sequence by two", "By flipping only the sign bit of the positive representation"], "ans": 0, "know": "**补码（two's complement）**\n- 负数 −x 存为 256 − x，也就是模 2⁸ 的“溢出”结果。\n- 等价做法：正数按位取反再加 1。\n- 例：5 = 00000101 → 取反 11111010 → +1 = 11111011 = 251 = 256 − 5。\n- −1 = 11111111；−128 = 10000000。\n\n**性质**\n- int8 范围 −128 ~ 127。\n- 加减法可以直接用无符号加法电路完成，0 只有一种表示。\n- 只翻转符号位（D）是“原码”，不是补码。", "exp": "答案 **A**。补码中 −x 存储为 2⁸ − x = 256 − x，相当于以 256 为模的溢出。", "prac": [{"q": "−3 的 int8 补码表示是？", "opts": ["10000011", "11111101", "11111100", "01111101"], "ans": 1, "exp": "256 − 3 = 253 = 11111101。也可以 3 = 00000011 取反得 11111100 再加 1。A 是原码，C 是反码。"}, {"q": "int8（补码）能表示的整数范围是？", "opts": ["0 ~ 255", "−127 ~ 127", "−128 ~ 127", "−128 ~ 128"], "ans": 2, "exp": "8 位共 256 个值，补码中 0 只有一种表示，所以是 −128 ~ 127。0 ~ 255 是 uint8。"}]}]}, {"id": "w2", "title": "Week 2", "subtitle": "PyTorch 张量（stride / view / einsum / 广播）、设备、代码规范、线性层与交叉熵", "questions": [{"t": "stride and offset", "q": "Given a PyTorch tensor a = torch.arange(1, 17).reshape(4, 4), we create a slice r = a[1:3, 1:3]. What are the values of r.stride() and r.storage_offset() respectively?", "opts": ["(2, 2) and 0", "(2, 1) and 5", "(4, 1) and 5", "(4, 1) and 6"], "ans": 2, "know": "**张量 = 一块一维存储 + 元数据（shape, stride, offset）**\n- stride[d]：沿第 d 维走一步，在底层存储里要跳过多少个元素。\n- 行优先连续张量 shape (H, W) 的 stride = (W, 1)。\n- storage_offset：这个张量的第一个元素在存储中的下标。\n- 元素 [i, j] 的位置 = offset + i·stride[0] + j·stride[1]。\n\n**基本切片返回 view**\n- `a[1:3, 1:3]` 不复制数据，stride 沿用原张量的 (4, 1)。\n- 新的 offset = 1·4 + 1·1 = 5（指向元素 6）。\n- 带步长的切片 `a[::2]` 会把 stride 乘上步长，例如 (8, 1)。", "exp": "答案 **C**。切片是 view，stride 不变仍为 (4, 1)；起点 a[1,1] 在存储中的下标 = 1×4 + 1 = 5。注意 5 是下标，对应的值是 6，D 把两者混淆了。", "prac": [{"q": "a = torch.arange(12).reshape(3, 4)，b = a.t()（转置）。b.stride() 是？", "opts": ["(4, 1)", "(1, 4)", "(3, 1)", "(1, 3)"], "ans": 1, "exp": "a 的 stride 是 (4, 1)。转置只交换 shape 和 stride 的顺序，不移动数据，所以 b 的 shape 为 (4, 3)，stride 为 (1, 4)。b 因此是非连续张量。"}, {"q": "a = torch.arange(1, 17).reshape(4, 4)，r = a[2:, 1:]。r.storage_offset() 是？", "opts": ["6", "8", "9", "10"], "ans": 2, "exp": "offset = 2×4 + 1×1 = 9。存储下标 9 对应的值是 10，D 是“值”而非“下标”。"}]}, {"t": "deep copy", "q": "Which of the following tensor operations in PyTorch forces a deep copy of the underlying data storage rather than returning a memory-sharing view?", "opts": ["a[:2, :2]", "a[:, [0, 2]]", "a.transpose((0, 1))", "a.reshape(2, 8)"], "ans": 1, "know": "**view（共享内存）vs copy（复制数据）**\n- 返回 view：基本切片 `a[i:j]`、`view`、`transpose`/`permute`/`t()`、`expand`、`squeeze`/`unsqueeze`、对连续张量做 `reshape`。\n- 一定复制：**高级索引**（用列表/张量/布尔掩码索引，如 `a[:, [0,2]]`、`a[a>0]`）、`clone()`、`contiguous()`（当原张量非连续时）。\n- `reshape` 能 view 就返回 view，不能（非连续）才复制。\n\n**判断方法**\n- `x.data_ptr()` 或 `x.untyped_storage().data_ptr()` 是否相同。\n- 修改结果后看原张量是否跟着变。", "exp": "答案 **B**。用列表 [0, 2] 索引属于高级索引，选出的列在内存中不能用固定 stride 描述，所以必须复制。A 是基本切片，C 是转置，D 对连续张量的 reshape，都返回 view。", "prac": [{"q": "下面哪个操作的结果一定与原张量 a 共享存储？", "opts": ["a[a > 0]", "a.clone()", "a.view(-1)", "a[[0, 1]]"], "ans": 2, "exp": "view 要求能在不移动数据的前提下改 shape，结果必然共享存储（不满足时会报错而不是复制）。布尔掩码和列表索引都是高级索引，会复制；clone 显式复制。"}, {"q": "b = a.t() 是非连续张量。对 b 调用 b.view(-1) 会怎样？", "opts": ["返回共享内存的一维 view", "报错，提示需要先 contiguous() 或改用 reshape", "自动复制并返回新张量", "返回原张量 a"], "ans": 1, "exp": "view 不会复制数据，非连续张量无法用单一 stride 展平，因此报 RuntimeError。b.reshape(-1) 或 b.contiguous().view(-1) 可以，此时会复制。"}]}, {"t": "einsum", "q": "What is the output shape of torch.einsum('ijk,kl->ijl', [A, B]) where A has shape (2, 3, 4) and B has shape (4, 5)?", "opts": ["torch.Size([2, 3, 5])", "torch.Size([2, 4, 5])", "torch.Size([3, 4, 5])", "torch.Size([2, 3, 4, 5])"], "ans": 0, "know": "**einsum 规则**\n- 每个字母对应一个维度，同一字母的维度大小必须相同。\n- 出现在输入、**没出现在输出** 的字母会被求和（收缩）。\n- 输出 shape 就是箭头右边字母按顺序对应的大小。\n\n**常见写法**\n- 矩阵乘法：`'ik,kj->ij'`\n- 批量矩阵乘：`'bik,bkj->bij'`\n- 点积：`'i,i->'`；外积：`'i,j->ij'`\n- 转置：`'ij->ji'`；迹：`'ii->'`\n- 注意力分数：`'bhqd,bhkd->bhqk'`", "exp": "答案 **A**。i=2, j=3, k=4, l=5。k 不在输出中被求和，输出 ijl = (2, 3, 5)。等价于 A @ B。", "prac": [{"q": "Q 形状 (8, 10, 64)，K 形状 (8, 12, 64)。torch.einsum('bqd,bkd->bqk', Q, K) 的输出形状是？", "opts": ["(8, 10, 64)", "(8, 10, 12)", "(8, 12, 10)", "(10, 12)"], "ans": 1, "exp": "b=8, q=10, k=12，d=64 被求和。输出 bqk = (8, 10, 12)，这就是批量计算 QKᵀ。"}, {"q": "x 形状 (5,)，y 形状 (7,)。torch.einsum('i,j->ij', x, y) 计算的是什么？", "opts": ["点积，输出标量", "外积，输出 (5, 7)", "逐元素乘积，输出 (5,)", "报错，维度不匹配"], "ans": 1, "exp": "i 和 j 都保留在输出中，没有求和，结果 [i,j] = x[i]·y[j]，是外积，形状 (5, 7)。"}]}, {"t": "Broadcasting", "q": "Consider broadcasting two tensors A of shape (4, 1, 3) and B of shape (2, 3) during element-wise addition A + B. What is the shape of the resulting tensor?", "opts": ["torch.Size([2, 4, 3])", "torch.Size([4, 1, 3])", "torch.Size([4, 2, 3])", "Runtime error"], "ans": 2, "know": "**广播规则（从最后一维向前对齐）**\n1. 维数少的张量在 **左边** 补 1。\n2. 逐维比较：大小相同，或其中一个是 1，就兼容；结果取较大者。\n3. 两个都不是 1 且不相等 → 报错。\n\n**例子**\n- (4,1,3) 与 (2,3)：B 补成 (1,2,3)，逐维 → (4,2,3)。\n- (3,) 与 (4,3) → (4,3)。\n- (2,3) 与 (3,2) → 最后一维 3 vs 2，报错。\n\n广播不会真的复制数据，内部相当于 stride 为 0 的 expand。", "exp": "答案 **C**。B 左边补 1 变为 (1, 2, 3)，与 (4, 1, 3) 逐维取最大：(4, 2, 3)。", "prac": [{"q": "形状 (5, 3, 1) 和 (4,) 的张量相加，结果形状是？", "opts": ["(5, 3, 4)", "(5, 3, 1)", "(5, 4, 1)", "报错"], "ans": 0, "exp": "(4,) 补成 (1, 1, 4)。逐维：5 vs 1 → 5，3 vs 1 → 3，1 vs 4 → 4，结果 (5, 3, 4)。"}, {"q": "形状 (2, 3) 和 (3, 2) 的张量相加，会怎样？", "opts": ["得到 (3, 3)", "得到 (2, 2)", "得到 (2, 3)", "报错，无法广播"], "ans": 3, "exp": "从右对齐：3 vs 2，两者都不是 1 且不相等，不能广播，抛出 RuntimeError。"}]}, {"t": "CPU GPU", "q": "When transferring a PyTorch tensor from CPU memory to GPU VRAM using x_gpu = x_cpu.to('cuda:0'), which statement accurately describes the underlying execution model?", "opts": ["CPU host memory and GPU device memory share unified physical RAM addresses by default across all standard systems.", "The Python process running on CPU sends an asynchronous memory copy request over PCIe bus to GPU VRAM.", "The tensor data is immediately modified in place inside host CPU main memory without allocation.", "The CPU halts all operating system processes until GPU completes hardware computation."], "ans": 1, "know": "**主机（host）与设备（device）**\n- 普通 PC/服务器上 CPU 内存（RAM）和 GPU 显存（VRAM）是两块独立的物理内存，通过 **PCIe 总线** 连接。\n- `.to('cuda')` 会在显存上新分配空间，再把数据拷过去，原 CPU 张量不变（排除 C）。\n- Python 进程在 CPU 上运行，它向 CUDA 流（stream）提交拷贝/计算命令，GPU 异步执行（排除 D）。\n- 用 `pin_memory()` + `non_blocking=True` 可以让拷贝真正与计算重叠。\n- 统一内存（Apple M 系列 SoC 等）是特例，不是默认情况（排除 A）。\n\n**实用要点**\n- 计时 GPU 代码前要 `torch.cuda.synchronize()`。\n- 尽量减少 CPU↔GPU 往返，`.item()`、`.cpu()` 会强制同步。", "exp": "答案 **B**。CPU 上的 Python 进程通过 CUDA 驱动发出内存拷贝请求，数据经 PCIe 传到显存，执行方式是异步的。", "prac": [{"q": "测量一段 GPU 代码的运行时间时，为什么在停止计时前要调用 torch.cuda.synchronize()？", "opts": ["CUDA 调用是异步的，不同步只能测到命令提交的时间", "否则 GPU 不会开始计算", "为了释放显存", "为了把结果复制回 CPU"], "ans": 0, "exp": "CPU 提交 kernel 后立即返回，GPU 还在后台运行。synchronize 会等 GPU 上的任务全部完成，测出的时间才准确。"}, {"q": "在训练循环里每一步都调用 loss.item() 打印损失，可能带来什么影响？", "opts": ["没有任何影响", "会改变梯度", "强制 CPU 等待 GPU 完成并把数据拷回，打断异步流水线、变慢", "会让模型参数转到 CPU"], "ans": 2, "exp": ".item() 需要 GPU 上的数值真正算出来并传回 CPU，因此会同步。频繁调用会降低吞吐，常见做法是每隔 N 步记录一次。"}]}, {"t": "Coding practice", "q": "According to the Google Python Style Guide discussed in AI practices, which of the following practices is explicitly discouraged?", "opts": ["Restricting code maximum line lengths to 80 characters.", "Using explicit line continuation backslashes (\\) instead of implicit line joining inside parentheses.", "Using typing module annotations such as Optional[torch.Tensor] for function signature type hints.", "Using docstrings containing explicit Args:, Returns:, and Raises: sections."], "ans": 1, "know": "**Google Python Style Guide 要点**\n- 每行最多 **80 个字符**。\n- 不要用反斜杠 `\\` 续行，改用括号、方括号、花括号内的 **隐式续行**。\n- 鼓励类型注解（`Optional[...]`、`list[int]` 等）。\n- 函数 docstring 使用 `Args:`、`Returns:`、`Raises:` 分节。\n- 命名：`module_name`、`ClassName`、`function_name`、`CONSTANT_NAME`。\n- 缩进 4 个空格，不用 tab。\n- 不要使用可变对象作为默认参数（如 `def f(x=[])`）。", "exp": "答案 **B**。Google 风格指南明确不建议用反斜杠续行，推荐在括号内隐式续行。A、C、D 都是推荐做法。", "prac": [{"q": "按 Google Python Style Guide，类名应该用哪种命名方式？", "opts": ["snake_case，如 data_loader", "CapWords，如 DataLoader", "全大写，如 DATA_LOADER", "camelCase，如 dataLoader"], "ans": 1, "exp": "类名用 CapWords（PascalCase）。函数和变量用 snake_case，常量用全大写。"}, {"q": "下面哪种写法被 Google Python Style Guide 明确反对？", "opts": ["def f(items=None): items = [] if items is None else items", "def f(items: list[int]) -> int:", "def f(items=[]):", "在 docstring 中写 Returns: 一节"], "ans": 2, "exp": "可变默认参数在函数定义时只创建一次，多次调用会共享同一个列表，容易出错。应使用 None 作为默认值，在函数内创建新列表。"}]}, {"t": "weight, bias", "q": "A fully connected linear layer maps an input tensor of dimension D_in = 784 to an output tensor of dimension D_out = 10. What are the parameters shape for weight W and bias b in PyTorch nn.Linear(784, 10)?", "opts": ["(10, 10) and (784, )", "(784, 10) and (784, )", "(784, 10) and (10, )", "(10, 784) and (10, )"], "ans": 3, "know": "**nn.Linear(in_features, out_features)**\n- 计算 y = x Wᵀ + b。\n- `weight` 形状是 **(out_features, in_features)**，`bias` 形状是 **(out_features,)**。\n- 参数总数 = in × out + out。\n- 例：Linear(784, 10) → 7840 + 10 = 7850 个参数。\n\n**容易错的地方**\n- 数学推导中常写 W ∈ ℝ^{in×out}、y = xW，PyTorch 存的是它的转置。\n- 输入 x 形状 (B, 784)，输出 (B, 10)。", "exp": "答案 **D**。PyTorch 的 weight 形状为 (out, in) = (10, 784)，bias 为 (10,)。C 是数学上 y = xW 写法的形状，不是 PyTorch 的存储方式。", "prac": [{"q": "nn.Linear(512, 256) 一共有多少个可训练参数（含 bias）？", "opts": ["131072", "131328", "131584", "768"], "ans": 1, "exp": "512 × 256 = 131072 个权重，加上 256 个偏置，共 131328。"}, {"q": "输入 x 的形状为 (32, 20, 128)，经过 nn.Linear(128, 64) 后输出形状是？", "opts": ["(32, 20, 64)", "(32, 64)", "(64, 20, 128)", "报错，只支持二维输入"], "ans": 0, "exp": "nn.Linear 只作用于最后一维，其他维度当作批次保持不变，输出 (32, 20, 64)。"}]}, {"t": "cross entropy loss", "q": "For a single instance with one-hot target y=[0,1,0] and predicted probabilities y'=[0.1,0.7,0.2], what is the Categorical Cross-Entropy loss value H(y, y')?", "opts": ["−ln(0.1)−ln(0.7)−ln(0.2)", "−ln(0.7)", "1.0−0.7", "−(0.1ln(0.1)+0.7ln(0.7)+0.2ln(0.2))"], "ans": 1, "know": "**交叉熵**\n- H(y, ŷ) = −Σ_c y_c · ln ŷ_c\n- y 是 one-hot 时，只有正确类别那一项非零，所以 H = −ln(ŷ_正确类)。\n- 预测越接近 1，损失越接近 0；预测趋近 0，损失趋于无穷大。\n\n**相关公式**\n- −Σ ŷ ln ŷ（选项 D）是预测分布自身的 **熵**，不是交叉熵。\n- PyTorch `nn.CrossEntropyLoss` 输入的是 **logits**（未经 softmax），内部做 log_softmax + NLL。\n- 二分类：BCE = −[y ln p + (1−y) ln(1−p)]。", "exp": "答案 **B**。one-hot 目标只在第 2 类为 1，H = −1·ln(0.7) ≈ 0.357。", "prac": [{"q": "目标 y = [1, 0, 0, 0]，预测 ŷ = [0.5, 0.2, 0.2, 0.1]。交叉熵损失约为多少？", "opts": ["0.5", "0.693", "1.609", "2.303"], "ans": 1, "exp": "H = −ln(0.5) = ln 2 ≈ 0.693。"}, {"q": "使用 PyTorch nn.CrossEntropyLoss 时，模型最后一层应该输出什么？", "opts": ["经过 softmax 的概率", "原始 logits（不加 softmax）", "经过 sigmoid 的概率", "one-hot 向量"], "ans": 1, "exp": "nn.CrossEntropyLoss 内部已经做了 log_softmax，再手动加 softmax 会导致重复归一化，梯度变小、训练变差。"}]}]}, {"id": "w3", "title": "Week 3（10-08）", "subtitle": "张量内存计算、MLP 处理图像的局限、数据标准化", "questions": [{"t": "bytes", "q": "Given a tensor created in PyTorch as b = torch.reshape(torch.arange(1, 4097, dtype=torch.float16), (16, 32, 8)), what is its total memory consumption in bytes?", "opts": ["4096 bytes", "8192 bytes", "16384 bytes", "32768 bytes"], "ans": 1, "know": "**张量内存 = 元素个数 × 每个元素的字节数**\n- `torch.arange(1, 4097)` 生成 1~4096，共 **4096** 个元素（右端点不包含）。\n- reshape 只改形状，元素数不变：16×32×8 = 4096。\n- 各 dtype 字节数：float64 8、float32 4、float16/bfloat16 2、int64 8、int32 4、int8/uint8 1、bool 1。\n\n**PyTorch 中查看**\n- `x.numel()` 元素个数，`x.element_size()` 单个元素字节数。\n- 总字节 = `x.numel() * x.element_size()`。", "exp": "答案 **B**。4096 个元素 × 2 字节（float16）= 8192 字节。", "prac": [{"q": "x = torch.zeros(64, 3, 32, 32)（默认 dtype float32）占用多少字节？", "opts": ["196608", "393216", "786432", "1572864"], "ans": 2, "exp": "元素数 = 64×3×32×32 = 196608，乘 4 字节 = 786432 字节（768 KiB）。"}, {"q": "y = torch.arange(0, 1000, dtype=torch.int64) 占用多少字节？", "opts": ["1000", "4000", "8000", "8008"], "ans": 2, "exp": "arange(0, 1000) 有 1000 个元素，int64 每个 8 字节，共 8000 字节。"}]}, {"t": "slicing", "q": "Suppose c is created by slicing tensor b of shape (16,32,8) via c = b[:, :16, :]. How many total elements does tensor c contain?", "opts": ["512 elements", "1024 elements", "2048 elements", "4096 elements"], "ans": 2, "know": "**切片后的形状**\n- `:` 保留整维；`:k` 取前 k 个；`i:j` 取 j−i 个；`::s` 取 ⌈n/s⌉ 个。\n- 整数索引（如 `b[0]`）会去掉该维。\n- 元素数 = 新形状各维相乘。\n\n**本题**\n- b 形状 (16, 32, 8)，`b[:, :16, :]` → (16, 16, 8)。\n- 切片是 view，不复制内存，c 和 b 共享存储。", "exp": "答案 **C**。新形状 (16, 16, 8)，元素数 16×16×8 = 2048。", "prac": [{"q": "b 形状为 (16, 32, 8)，d = b[::2, 5:15, 0]。d 的形状是？", "opts": ["(8, 10)", "(8, 10, 1)", "(16, 10)", "(8, 15)"], "ans": 0, "exp": "::2 → 16/2 = 8；5:15 → 10；整数索引 0 去掉最后一维。结果 (8, 10)。"}, {"q": "b 形状为 (16, 32, 8)，e = b[3:, :, 4:] 有多少元素？", "opts": ["1024", "1536", "1664", "2048"], "ans": 2, "exp": "形状 (13, 32, 4)，元素数 13×32×4 = 1664。"}]}, {"t": "MLP for images", "q": "Why are standard fully-connected linear layers impractical for processing raw high-resolution 2D images directly?", "opts": ["Linear layers cannot execute floating-point operations on 2D arrays.", "The number of parameters is too large.", "Cross-entropy loss cannot be calculated for vectors larger than 1000 elements.", "Gradient descent fails when input pixel values range between 0 and 255."], "ans": 1, "know": "**全连接层处理图像的问题**\n- 图像要先展平：224×224×3 = 150528 维。\n- 接一个 1000 维隐藏层就需要约 1.5 亿个权重，单层就占约 600 MB（fp32）。\n- 每个输出都连接所有像素，没有利用图像的 **局部性** 和 **平移不变性**，参数多且容易过拟合。\n\n**CNN 的改进**\n- 局部连接：每个输出只看 K×K 的邻域。\n- 权重共享：同一个卷积核在整张图上滑动，参数量与图像分辨率无关。", "exp": "答案 **B**。高分辨率图像展平后维度很大，全连接层参数量 = 输入维度 × 输出维度，太大难以存储和训练。其他选项都是错误说法。", "prac": [{"q": "一张 1000×1000 的灰度图展平后接一个 100 个神经元的全连接层，权重（不含 bias）有多少个？", "opts": ["10⁵", "10⁶", "10⁷", "10⁸"], "ans": 3, "exp": "输入 10⁶ 维 × 输出 100 = 10⁸ 个权重，fp32 下约 400 MB。"}, {"q": "卷积层的参数量主要由什么决定？", "opts": ["输入图像的高和宽", "卷积核大小和输入/输出通道数", "batch size", "训练样本数量"], "ans": 1, "exp": "卷积层参数 = C_in × C_out × K × K (+ C_out)，与图像分辨率无关，这是权重共享带来的。"}]}, {"t": "Data normalization", "q": "Why are input datasets typically normalized using dataset mean and standard deviation before feeding them into deep neural networks?", "opts": ["To convert 2D image representations into 1D flattened feature vectors automatically.", "To eliminate the necessity of computing soft-max classification losses.", "To reduce the required bit-depth of model parameter weights from float32 to int8.", "To standardize input distributions, facilitating faster and more stable optimization convergence."], "ans": 3, "know": "**输入标准化：x' = (x − μ) / σ**\n- 让各特征（或各通道）均值约为 0、标准差约为 1。\n- 各维尺度一致时，损失曲面更“圆”，梯度下降步长更合适，收敛更快、更稳定。\n- 避免某些输入过大导致激活饱和或梯度爆炸。\n\n**实践**\n- μ、σ 只在 **训练集** 上统计，验证/测试集使用同样的值。\n- 图像常按通道标准化，例如 ImageNet：mean = (0.485, 0.456, 0.406)，std = (0.229, 0.224, 0.225)。\n- PyTorch：`transforms.Normalize(mean, std)`。", "exp": "答案 **D**。标准化统一输入分布的尺度，使优化更快、更稳定。展平、softmax、量化都和它无关。", "prac": [{"q": "做标准化时，验证集和测试集应该使用哪里统计的均值和标准差？", "opts": ["各自数据集自己的统计量", "训练集的统计量", "验证集和测试集合并后的统计量", "固定使用 0 和 1"], "ans": 1, "exp": "统计量只能来自训练集，否则等于让模型提前看到了测试数据的信息（数据泄漏），而且训练与测试的预处理会不一致。"}, {"q": "某像素值 x = 0.8，该通道 mean = 0.5，std = 0.25。标准化后的值是？", "opts": ["0.3", "1.2", "0.075", "3.2"], "ans": 1, "exp": "(0.8 − 0.5) / 0.25 = 1.2。"}]}]}, {"id": "w4", "title": "Week 4（10-15）", "subtitle": "计算机体系结构与硬件、CNN 基础（参数、padding、感受野、池化）、ReLU", "questions": [{"t": "bottleneck", "q": "In a Von Neumann architecture, which component serves as the primary system bottleneck when transferring large volumes of data between the processing unit and memory?", "opts": ["The ALU registers", "The L1 instruction cache", "The video interface controller", "The system bus"], "ans": 3, "know": "**冯·诺依曼瓶颈**\n- 冯·诺依曼结构中，指令和数据存在同一块内存里，CPU 与内存之间通过 **系统总线** 传输。\n- CPU 算得很快，但每次都要等数据从内存经总线搬过来，带宽和延迟成为瓶颈。\n- 深度学习大多是 **访存密集型**（memory-bound）：搬数据比算数据更慢。\n\n**缓解方法**\n- 多级缓存（L1/L2/L3）、寄存器复用数据。\n- 高带宽显存 HBM、更宽的总线。\n- 存内计算、SoC 统一内存、算子融合（减少中间结果读写）。", "exp": "答案 **D. 系统总线**。处理器与内存之间的所有数据都经过总线，总线带宽限制了传输速度。寄存器和 L1 缓存是用来缓解这个瓶颈的。", "prac": [{"q": "下面哪种存储的访问速度最快？", "opts": ["主存 DRAM", "L3 缓存", "寄存器", "SSD"], "ans": 2, "exp": "速度：寄存器 > L1 > L2 > L3 > DRAM > SSD > HDD；容量则反过来。"}, {"q": "某算子每读入 1 字节数据只做 0.5 次浮点运算，在 GPU 上运行时最可能受什么限制？", "opts": ["计算能力（compute-bound）", "内存带宽（memory-bound）", "磁盘容量", "CPU 主频"], "ans": 1, "exp": "算术强度（FLOPs/Byte）很低，GPU 计算单元大部分时间在等数据，属于访存受限。逐元素运算（加法、激活函数）通常是这一类。"}]}, {"t": "hardware", "q": "What is a primary hardware architectural advantage of a System-on-a-Chip (SoC) such as the Apple A18 compared to traditional desktop CPU-GPU setups with separate memory pools?", "opts": ["Elimination of all cache memory hierarchies in favor of direct disk access.", "Completely removing the need for operating system memory management.", "Reduced power consumption and communication latency by integrating CPU, GPU, and cache on the same silicon die.", "Infinite scalability of thermal dissipation without requiring heatsinks."], "ans": 2, "know": "**SoC（片上系统）**\n- 把 CPU、GPU、NPU（神经网络引擎）、缓存、内存控制器等集成在同一块芯片上。\n- 通常配合 **统一内存**：CPU 和 GPU 共享同一块物理内存，不需要经 PCIe 来回拷贝。\n- 优点：组件间距离短 → 通信延迟低、功耗低，适合手机、笔记本。\n- 局限：总功耗和散热受限，峰值算力和显存容量一般不如独立高端 GPU。\n\n**传统台式机**\n- CPU 内存与 GPU 显存分开，数据要通过 PCIe 拷贝。", "exp": "答案 **C**。SoC 把 CPU、GPU、缓存集成在同一芯片上，减少片间通信，降低延迟和功耗。其他选项都不成立：缓存依然存在，操作系统仍需管理内存，散热也有限制。", "prac": [{"q": "在采用统一内存的 SoC（如 Apple M 系列）上，CPU 处理完的数据交给 GPU 时，与独立显卡相比主要省去了什么？", "opts": ["GPU 的计算过程", "通过 PCIe 在主存和显存之间复制数据", "操作系统调度", "缓存"], "ans": 1, "exp": "CPU 和 GPU 访问同一块物理内存，无需把数据从 RAM 复制到独立的 VRAM。"}, {"q": "手机 SoC 中的 NPU（神经网络处理器）主要优化的是哪类运算？", "opts": ["字符串处理", "低精度的矩阵乘加（如 int8/fp16 MAC）", "磁盘 I/O", "网络协议栈"], "ans": 1, "exp": "NPU 内部是大量乘加单元阵列，专门以低功耗执行神经网络中的低精度矩阵乘和卷积。"}]}, {"t": "parameters", "q": "Why do convolutional layers generally require significantly fewer parameters than fully-connected (dense) layers when processing high-resolution images?", "opts": ["Weight sharing and local connectivity", "Forcing all input tensors to be 1D vectors", "Eliminating channel depth dimensions", "Bypassing activation functions entirely"], "ans": 0, "know": "**CNN 参数少的两个原因**\n- **局部连接**：每个输出只与输入中 K×K 的邻域相连，而不是全部像素。\n- **权重共享**：同一个卷积核在整幅图的所有位置上使用。\n\n**参数量对比**\n- 卷积层：C_in × C_out × K × K + C_out，与图像大小无关。\n- 全连接层：(H·W·C_in) × D_out + D_out，随分辨率增长。\n- 例：输入 224×224×3，输出 64 通道，3×3 卷积 → 3·64·9 + 64 = 1792 个参数。", "exp": "答案 **A. 权重共享与局部连接**。卷积核只看局部且在各位置共享，参数量与输入分辨率无关。", "prac": [{"q": "卷积层输入 64 通道、输出 128 通道、卷积核 3×3、带 bias，参数量是多少？", "opts": ["73728", "73856", "8192", "1152"], "ans": 1, "exp": "64 × 128 × 3 × 3 = 73728，加上 128 个 bias = 73856。"}, {"q": "把卷积层的输入从 32×32 换成 256×256（通道数和卷积核不变），参数量如何变化？", "opts": ["增加 64 倍", "增加 8 倍", "不变", "减少"], "ans": 2, "exp": "参数只由 C_in、C_out、K 决定，与空间尺寸无关。计算量和激活值显存会随分辨率增加，参数量不变。"}]}, {"t": "padding", "q": "What is the exact padding size (P) required in a 2D convolutional layer with a kernel size K (assuming odd kernel size and a stride of 1) to ensure the output spatial resolution remains identical to the input spatial resolution?", "opts": ["(K−1)/2", "K−1", "K/2", "2K−1"], "ans": 0, "know": "**卷积输出尺寸公式**\n- W_out = ⌊(W_in + 2P − K) / S⌋ + 1\n\n**same padding**\n- 令 S = 1，W_out = W_in：W_in + 2P − K + 1 = W_in → **P = (K − 1) / 2**。\n- K = 3 → P = 1；K = 5 → P = 2；K = 7 → P = 3。\n- K 为奇数时 P 是整数，这也是卷积核通常取奇数的原因之一。", "exp": "答案 **A. (K−1)/2**。代入 S=1 的输出公式，要求 W_in + 2P − K + 1 = W_in，解得 P = (K−1)/2。", "prac": [{"q": "使用 7×7 卷积核、stride 1，要保持输出尺寸不变，padding 应为多少？", "opts": ["2", "3", "6", "7"], "ans": 1, "exp": "P = (7 − 1) / 2 = 3。"}, {"q": "输入 32×32，卷积核 3×3，padding 1，stride 2，输出尺寸是多少？", "opts": ["32×32", "16×16", "15×15", "17×17"], "ans": 1, "exp": "⌊(32 + 2 − 3) / 2⌋ + 1 = ⌊31/2⌋ + 1 = 15 + 1 = 16。"}]}, {"t": "receptive field", "q": "What is the receptive field size of the final output pixel in a network consisting of 4 consecutive convolutional layers, each using a 3×3 kernel with a stride of 1 and no padding (valid convolution)?", "opts": ["5×5", "9×9", "12×12", "81×81"], "ans": 1, "know": "**感受野（receptive field）**：一个输出像素能“看到”的输入区域大小。\n\n**递推公式**\n- r_l = r_{l−1} + (K_l − 1) × j_{l−1}，其中 j 是之前所有层 stride 的乘积（跳距）。\n- 全部 stride = 1 时：r = 1 + L × (K − 1)。\n- L 层 3×3 卷积：r = 2L + 1。\n\n**本题**：4 层 3×3 → 1 + 4×2 = 9。\n\n**补充**\n- padding 不影响感受野大小。\n- 两层 3×3 的感受野等于一层 5×5，但参数更少（18 vs 25 每通道对），这是 VGG 的设计思路。", "exp": "答案 **B. 9×9**。stride 为 1 时每层 3×3 卷积让感受野加 2：1 → 3 → 5 → 7 → 9。", "prac": [{"q": "6 层连续的 3×3 卷积（stride 1）后，输出像素的感受野是多少？", "opts": ["7×7", "12×12", "13×13", "18×18"], "ans": 2, "exp": "r = 1 + 6 × 2 = 13。"}, {"q": "网络结构为：3×3 卷积(s=1) → 2×2 池化(s=2) → 3×3 卷积(s=1)。最终输出的感受野是多少？", "opts": ["5×5", "6×6", "8×8", "10×10"], "ans": 2, "exp": "第 1 层：r=3, j=1。池化：r = 3 + (2−1)×1 = 4，j = 2。第 3 层：r = 4 + (3−1)×2 = 8。"}]}, {"t": "max vs mean pooling", "q": "Why is max pooling predominantly preferred over mean pooling in image understanding and classification networks?", "opts": ["It averages all background noise to zero across the entire feature map.", "It captures the strongest local response.", "It expands the spatial resolution of feature maps exponentially.", "It eliminates the need for any non-linear activation functions in intermediate layers."], "ans": 1, "know": "**最大池化**\n- 在每个窗口中取最大值，保留 **最强的局部响应**（某个特征“是否出现”）。\n- 对小的位置偏移不敏感，带来一定平移不变性。\n- 反向传播时梯度只流向最大值位置。\n\n**平均池化**\n- 取窗口平均，会把强响应和背景混在一起，削弱显著特征。\n- 常用于网络末端的 **全局平均池化（GAP）**，把每个通道压成一个数再接分类器。\n\n**共同点**：都会 **缩小** 空间尺寸（排除 C），池化本身不能替代激活函数（排除 D）。", "exp": "答案 **B**。分类任务关心某个特征有没有出现，最大池化保留窗口中最强的激活，而平均池化会被背景稀释。", "prac": [{"q": "对 2×2 窗口 [[1, 3], [2, 8]] 分别做最大池化和平均池化，结果是？", "opts": ["8 和 3.5", "8 和 14", "3.5 和 8", "1 和 3.5"], "ans": 0, "exp": "max = 8；mean = (1 + 3 + 2 + 8) / 4 = 3.5。"}, {"q": "输入特征图 (64, 28, 28)，经过 2×2、stride 2 的最大池化后，形状和参数量分别是？", "opts": ["(64, 14, 14)，0 个参数", "(32, 14, 14)，4 个参数", "(64, 14, 14)，256 个参数", "(64, 28, 28)，0 个参数"], "ans": 0, "exp": "池化逐通道进行，通道数不变；空间尺寸减半为 14×14。池化没有可学习参数。"}]}, {"t": "growth rate", "q": "How does the receptive field growth rate differ fundamentally between a convolutional layer and a pooling layer (with stride 2)?", "opts": ["Pooling layers cause the receptive field to expand much faster because adjacent pooling outputs do not share input pixels.", "There is no difference; both expand receptive fields at an identical linear rate.", "Convolutional layers expand receptive fields exponentially, whereas pooling layers keep them constant.", "Pooling layers shrink the receptive field back down to 1x1."], "ans": 0, "know": "**stride 1 卷积**：相邻输出窗口高度重叠（3×3 卷积相邻输出共享 2 列输入），每层感受野只加 K−1，属于 **线性增长**。\n\n**stride 2 池化**：相邻输出的窗口不重叠，每个后续层的一步相当于输入上的 2 步，后面所有层的感受野增量都 **乘以 2**。\n- 多次下采样后，感受野随层数 **指数增长**。\n\n**公式**\n- r_l = r_{l−1} + (K_l − 1) × j_{l−1}，j_l = j_{l−1} × S_l。\n- 下采样提高 j，让之后的每一层“看得更远”。", "exp": "答案 **A**。stride 2 的池化让相邻输出不再共享输入像素，跳距翻倍，之后各层的感受野增长更快。stride 1 卷积因窗口重叠，增长较慢。", "prac": [{"q": "每经过一次 2×2、stride 2 的池化，之后每层 3×3 卷积（stride 1）对感受野的增量变为原来的几倍？", "opts": ["不变", "2 倍", "4 倍", "减半"], "ans": 1, "exp": "增量 = (K−1) × j。池化把跳距 j 乘以 2，所以后续增量变为 2 倍。"}, {"q": "若要用尽量少的层获得很大的感受野，下面哪种做法最有效？", "opts": ["堆叠更多 stride 1 的 1×1 卷积", "插入 stride 2 的下采样（池化或步长卷积）", "增加通道数", "去掉激活函数"], "ans": 1, "exp": "下采样让跳距成倍增长，感受野随下采样次数指数扩大。1×1 卷积不增加感受野，通道数和激活函数都与感受野无关。"}]}, {"t": "step function", "q": "What is the primary mathematical advantage of ReLU (g(y)=max(0,y)) over a traditional step function in neural networks?", "opts": ["It completely prevents any neuron from ever outputting a zero value.", "It introduces non-linear squaring terms that increase polynomial representation capacity.", "It bounds all output values strictly between -1 and 1.", "It preserves gradient flow and retains proportional magnitude information for positive inputs."], "ans": 3, "know": "**阶跃函数**：输出只有 0/1，导数几乎处处为 0，无法用梯度下降训练，并且丢失了输入大小的信息。\n\n**ReLU = max(0, y)**\n- y > 0 时导数恒为 1，梯度能顺畅回传，不会饱和。\n- 正输入时输出与输入成比例，保留幅度信息。\n- 计算简单。\n- 缺点：y < 0 时输出和梯度为 0，可能出现“死神经元”（排除 A）。改进有 Leaky ReLU、GELU 等。\n- ReLU 是分段线性的，不含平方项（排除 B），输出无上界（排除 C；有界的是 tanh）。", "exp": "答案 **D**。ReLU 在正区间梯度为 1，保持梯度流动，同时输出保留了输入的大小；阶跃函数的梯度几乎处处为 0。", "prac": [{"q": "ReLU 在输入 y = −2 和 y = 3 处的导数分别是？", "opts": ["0 和 1", "0 和 3", "−2 和 3", "1 和 1"], "ans": 0, "exp": "y < 0 时 ReLU 为常数 0，导数为 0；y > 0 时 ReLU = y，导数为 1。"}, {"q": "所谓“dying ReLU”问题指的是什么？", "opts": ["ReLU 输出过大导致溢出", "神经元的输入始终为负，输出和梯度一直为 0，参数不再更新", "ReLU 让网络退化为线性模型", "ReLU 不能在 GPU 上计算"], "ans": 1, "exp": "如果某神经元对所有样本的输入都小于 0，它的梯度始终为 0，就再也学不动了。Leaky ReLU 在负区间给一个小斜率来缓解。"}]}]}, {"id": "w5", "title": "Week 5（10-22）", "subtitle": "卷积输出尺寸与参数量、ViT、sigmoid 导数、感受野、自注意力复杂度", "questions": [{"t": "1D conv", "q": "A 1D convolutional layer processes an input sequence of length W_in = 45 using a kernel of size K = 5, padding P = 2, and stride S = 3. What is the resulting output width W_out?", "opts": ["13", "14", "15", "16"], "ans": 2, "know": "**卷积输出尺寸（1D/2D 每个维度都一样）**\n- W_out = ⌊(W_in + 2P − K) / S⌋ + 1\n- 先加 padding，减去卷积核，除以步长 **向下取整**，最后加 1。\n\n**常见坑**\n- 忘记 +1。\n- 忘记 padding 是两边都加（2P）。\n- 不能整除时向下取整，而不是四舍五入。", "exp": "答案 **C. 15**。(45 + 2×2 − 5) / 3 = 44 / 3 = 14.67，向下取整 14，再加 1 得 15。", "prac": [{"q": "1D 卷积：W_in = 100，K = 7，P = 3，S = 2。W_out = ?", "opts": ["47", "49", "50", "51"], "ans": 2, "exp": "⌊(100 + 6 − 7) / 2⌋ + 1 = ⌊99/2⌋ + 1 = 49 + 1 = 50。"}, {"q": "1D 卷积：W_in = 30，K = 4，P = 0，S = 4。W_out = ?", "opts": ["6", "7", "8", "27"], "ans": 1, "exp": "⌊(30 − 4) / 4⌋ + 1 = ⌊6.5⌋ + 1 = 6 + 1 = 7。"}]}, {"t": "2D conv (parameters)", "q": "Consider a convolutional layer with input channels C^(l) = 3, output channels C^(l+1) = 96, and kernel size K = 3. If bias is enabled, what is the number of parameters (including bias) in this layer?", "opts": ["864", "960", "2592", "2688"], "ans": 3, "know": "**卷积层参数量**\n- 每个输出通道有一个 C_in × K × K 的卷积核，外加 1 个 bias。\n- 总参数 = C_out × (C_in × K × K + 1) = C_in·C_out·K² + C_out。\n\n**容易漏掉的**\n- 忘乘 C_in（得到 96×9 = 864，选项 A）。\n- 忘加 bias（得到 2592，选项 C）。\n- PyTorch 中 `conv.weight.shape = (C_out, C_in, K, K)`，`conv.bias.shape = (C_out,)`。", "exp": "答案 **D. 2688**。权重 3 × 96 × 3 × 3 = 2592，bias 96 个，合计 2688。", "prac": [{"q": "卷积层 C_in = 16，C_out = 32，K = 5，带 bias。参数量是？", "opts": ["12800", "12832", "800", "25632"], "ans": 1, "exp": "16 × 32 × 25 = 12800，加 32 个 bias = 12832。"}, {"q": "1×1 卷积，C_in = 256，C_out = 64，不带 bias。参数量是？", "opts": ["320", "16384", "16448", "147456"], "ans": 1, "exp": "256 × 64 × 1 × 1 = 16384。1×1 卷积常用来降低通道数（如 ResNet bottleneck）。"}]}, {"t": "2D conv (output size)", "q": "Consider a 2D convolutional layer with input resolution H_in = 128, W_in = 128, kernel size K = 5, stride S = 1, and padding P = 0. What are the dimensions of the output tensor resolution H_out x W_out?", "opts": ["128 x 128", "126 x 126", "124 x 124", "64 x 64"], "ans": 2, "know": "**valid 卷积（P = 0, S = 1）**\n- H_out = H_in − K + 1。\n- 每边各少 (K − 1)/2 个像素。\n- 5×5 卷积：每边少 2，总共少 4。\n\n**对比**\n- same 卷积（P = (K−1)/2）：尺寸不变。\n- stride 2：尺寸大约减半。", "exp": "答案 **C. 124 × 124**。(128 + 0 − 5) / 1 + 1 = 124。", "prac": [{"q": "输入 64×64，3×3 卷积，P = 0，S = 1，连续做 3 层。最终输出尺寸是？", "opts": ["62×62", "60×60", "58×58", "64×64"], "ans": 2, "exp": "每层减 2：64 → 62 → 60 → 58。"}, {"q": "输入 224×224，7×7 卷积，P = 3，S = 2（ResNet 第一层）。输出尺寸是？", "opts": ["112×112", "109×109", "111×111", "224×224"], "ans": 0, "exp": "⌊(224 + 6 − 7) / 2⌋ + 1 = ⌊223/2⌋ + 1 = 111 + 1 = 112。"}]}, {"t": "ViT", "q": "Given an input image of size 224 x 224 x 3, a Vision Transformer (ViT-B/16) splits the image into non-overlapping patches of size 16 x 16 x 3. What is the resulting sequence length, excluding the [CLS] token?", "opts": ["196", "197", "256", "768"], "ans": 0, "know": "**ViT 把图像切成 patch 当作 token**\n- patch 数 = (H / P) × (W / P)。\n- 224 / 16 = 14，14 × 14 = 196 个 patch。\n- 每个 patch 展平后维度 = 16 × 16 × 3 = 768，再线性投影到隐藏维度 D（ViT-B 的 D 也是 768）。\n- 加上 [CLS] token 后序列长度为 197。\n\n**命名**\n- ViT-B/16：Base 模型，patch 大小 16。\n- ViT-L/14：Large 模型，patch 大小 14。", "exp": "答案 **A. 196**。(224/16)² = 14² = 196。197 包含 [CLS]；768 是每个 patch 的展平维度，不是序列长度。", "prac": [{"q": "ViT-L/14 处理 224×224 的图像，包含 [CLS] 时序列长度是？", "opts": ["196", "256", "257", "197"], "ans": 2, "exp": "224 / 14 = 16，16² = 256 个 patch，加 [CLS] = 257。"}, {"q": "ViT 中把输入分辨率从 224 提高到 384（patch 仍为 16），自注意力的计算量大约变为原来的多少倍？", "opts": ["约 1.7 倍", "约 2.9 倍", "约 8.6 倍", "不变"], "ans": 2, "exp": "token 数从 196 变为 (384/16)² = 576，约 2.94 倍。自注意力是 O(N²)，计算量约 2.94² ≈ 8.6 倍。"}]}, {"t": "derivative", "q": "Given a sigmoid activation function defined as f(y) = 1 / (1 + e^-y), what is its derivative evaluated in terms of f(y)?", "opts": ["f(y) f(y) (1 - f(y))", "1−f(y) f(y)", "(1−f(y)) (1−f(y))", "f(y) (1−f(y))"], "ans": 3, "know": "**sigmoid 导数推导**\n- f(y) = (1 + e^{−y})^{−1}\n- f'(y) = e^{−y} / (1 + e^{−y})² = f(y) · e^{−y}/(1 + e^{−y}) = **f(y)(1 − f(y))**\n\n**性质**\n- 最大值在 y = 0：f = 0.5，f' = 0.25。\n- |y| 很大时 f' → 0，即 **梯度饱和**，深层网络中会造成梯度消失。\n\n**其他激活函数的导数**\n- tanh' = 1 − tanh²，最大值 1。\n- ReLU' = 1（y > 0），0（y < 0）。", "exp": "答案 **D. f(y)(1 − f(y))**。推导见知识点。", "prac": [{"q": "sigmoid 导数的最大值是多少？", "opts": ["1", "0.5", "0.25", "0"], "ans": 2, "exp": "f(1 − f) 在 f = 0.5（y = 0）时最大，0.5 × 0.5 = 0.25。所以每经过一层 sigmoid，梯度至少缩小 4 倍。"}, {"q": "tanh(y) 的导数用 tanh 表示是？", "opts": ["tanh(y)(1 − tanh(y))", "1 − tanh²(y)", "1 + tanh²(y)", "2·tanh(y)"], "ans": 1, "exp": "d/dy tanh(y) = 1 − tanh²(y)，在 y = 0 时为 1。也可由 tanh(y) = 2σ(2y) − 1 推出。"}]}, {"t": "receptive field (conv)", "q": "If a convolutional network uses 3×3 convolution layers exclusively (without pooling), how much does the receptive field increase in each dimension with each additional convolutional layer?", "opts": ["Doubles in size", "Increases by 1", "Increases by 2", "Increases by 3"], "ans": 2, "know": "**stride 1 卷积的感受野增长**\n- 每增加一层 K×K 卷积，感受野增加 K − 1。\n- 3×3：每层 +2（1 → 3 → 5 → 7 …），线性增长。\n- 5×5：每层 +4。\n- 公式：r = 1 + L(K − 1)。", "exp": "答案 **C. 每层增加 2**。3×3 卷积在原感受野的两侧各扩展 1 个像素。", "prac": [{"q": "只用 5×5 卷积（stride 1、无池化），每多一层感受野在每个维度增加多少？", "opts": ["2", "4", "5", "加倍"], "ans": 1, "exp": "增量 = K − 1 = 4。"}, {"q": "只用 3×3 卷积（stride 1），要让感受野达到 15×15 至少需要几层？", "opts": ["5", "6", "7", "8"], "ans": 2, "exp": "1 + 2L ≥ 15 → L ≥ 7。"}]}, {"t": "receptive field (pooling)", "q": "How does the receptive field scale with respect to the number of 2×2 pooling layers (with stride 2)?", "opts": ["Doubles in size", "Increases by 1", "Increases by 2", "Increases by 3"], "ans": 0, "know": "**下采样让感受野成倍增长**\n- 2×2、stride 2 的池化让跳距（jump）翻倍，后续每层看到的范围也翻倍。\n- 连续 L 个 2×2/s2 池化层：感受野为 2^L，指数增长。\n- 这与 stride 1 卷积每层只加 K−1 的线性增长形成对比（参见上一题和 Week 4 的 growth rate 题）。", "exp": "答案 **A. 加倍**。每个 2×2/s2 池化层不重叠地合并输入，感受野每层翻一倍。", "prac": [{"q": "连续 4 个 2×2、stride 2 的池化层后，输出像素的感受野是多少？", "opts": ["5×5", "8×8", "9×9", "16×16"], "ans": 3, "exp": "每层翻倍：2 → 4 → 8 → 16。"}, {"q": "一个 224×224 的输入经过 5 次 stride 2 下采样后，特征图的空间尺寸是？", "opts": ["14×14", "7×7", "28×28", "112×112"], "ans": 1, "exp": "224 / 2⁵ = 7。这就是 ResNet、VGG 最后一层特征图为 7×7 的原因。"}]}, {"t": "time complexity", "q": "What is the time complexity of self-attention with respect to the sequence length N and feature dimension D?", "opts": ["O(N^2 D^2)", "O(NlogN)", "O(N^2 D)", "O(N D^2)"], "ans": 2, "know": "**自注意力的计算步骤**\n1. Q, K, V = XW_Q, XW_K, XW_V：每个 (N×D)(D×D)，O(N D²)。\n2. 分数 QKᵀ：(N×D)(D×N)，O(**N² D**)。\n3. softmax：O(N²)。\n4. 加权求和 AV：(N×N)(N×D)，O(N² D)。\n\n**结论**\n- 注意力本身（第 2、4 步）是 O(N² D)，这是题目问的答案。\n- 加上线性投影，整层是 O(N² D + N D²)。\n- 注意力矩阵占用 O(N²) 内存，长序列时是主要瓶颈（FlashAttention 等方法用来缓解）。", "exp": "答案 **C. O(N² D)**。计算 QKᵀ 和 AV 时，N×N 个位置对中每一对都要做 D 维的点积。O(N D²) 是线性投影的复杂度。", "prac": [{"q": "序列长度从 1024 增加到 4096（D 不变），自注意力中 QKᵀ 的计算量变为原来的多少倍？", "opts": ["4 倍", "8 倍", "16 倍", "64 倍"], "ans": 2, "exp": "计算量 ∝ N²，(4096/1024)² = 16。"}, {"q": "N = 2048 的序列，单个头的注意力矩阵用 float16 存储需要多少字节？", "opts": ["4 MB（约 4.19×10⁶ 字节）", "8 MB（约 8.39×10⁶ 字节）", "2 MB", "16 MB"], "ans": 1, "exp": "N² = 2048² = 4194304 个元素，× 2 字节 = 8388608 字节 ≈ 8 MB。"}]}]}, {"id": "w6", "title": "Week 6（10-29）", "subtitle": "Transformer（归一化、掩码注意力、softmax 缩放）、训练与推理内存、FLOPs、ONNX、数据标注与泛化", "questions": [{"t": "Normalization", "q": "In neural network normalization layers, what is the mathematical purpose of introducing the epsilon parameter ε inside the denominator square root of (σ^2 + ε)?", "opts": ["Control learning rate decay.", "Normalize gradient magnitudes.", "Prevent division by zero.", "Scale output variance bounds."], "ans": 2, "know": "**归一化公式**\n- x̂ = (x − μ) / √(σ² + ε)，再做 y = γ x̂ + β。\n- ε 是一个很小的正数（常见 1e-5 或 1e-6）。\n- 如果一组数据完全相同，σ² = 0，没有 ε 就会除以 0 得到 inf/NaN。\n\n**BatchNorm vs LayerNorm**\n- BatchNorm：对每个通道，在 batch（和空间）维度上统计 μ、σ；训练和推理行为不同（推理用滑动平均）。\n- LayerNorm：对每个样本，在特征维度上统计；与 batch 大小无关，Transformer 常用。\n- γ、β 是可学习参数，让网络可以恢复需要的尺度和偏移。", "exp": "答案 **C. 防止除以零**。方差可能为 0 或非常接近 0，加 ε 保证数值稳定。", "prac": [{"q": "Transformer 中最常用的归一化层是？", "opts": ["BatchNorm", "LayerNorm", "InstanceNorm", "不使用归一化"], "ans": 1, "exp": "LayerNorm 对每个 token 的特征维度归一化，不依赖 batch 大小，也适合变长序列。很多新模型改用 RMSNorm（去掉减均值）。"}, {"q": "隐藏维度为 768 的 nn.LayerNorm(768) 有多少个可学习参数？", "opts": ["0", "768", "1536", "768²"], "ans": 2, "exp": "γ 和 β 各 768 个，共 1536。"}]}, {"t": "Masked attention", "q": "When training a decoder-only Transformer model, why is masked attention applied during parallel training?", "opts": ["To reduce matrix multiplication computational complexity.", "To eliminate the need for positional encodings.", "To prevent future token information leakage during parallel processing.", "To stabilize layer normalization variance."], "ans": 2, "know": "**因果掩码（causal mask）**\n- 解码器（GPT 类）按“根据前文预测下一个 token”的方式训练。\n- 训练时整句一次性并行输入，如果不加掩码，位置 t 能看到 t+1 之后的答案，等于作弊。\n- 做法：在 softmax 前把上三角（j > i）的分数设为 −∞，softmax 后权重为 0。\n- 这样一次前向就能同时训练所有位置，且与逐词生成时的条件一致。\n\n**注意**\n- 掩码不减少计算量（仍计算完整的 N×N 矩阵，排除 A）。\n- 仍需要位置编码（排除 B）。", "exp": "答案 **C**。掩码保证每个位置只能关注自己及之前的 token，防止并行训练时泄露未来信息。", "prac": [{"q": "序列长度为 4 的因果掩码中，第 2 个位置（下标 1）可以关注哪些位置？", "opts": ["只有位置 1", "位置 0 和 1", "位置 1、2、3", "全部 4 个位置"], "ans": 1, "exp": "因果掩码只允许 j ≤ i，下标 1 可以关注下标 0 和 1。"}, {"q": "实现因果掩码时，为什么在 softmax 之前把被屏蔽位置的分数设为 −∞，而不是设为 0？", "opts": ["−∞ 计算更快", "e^{−∞} = 0，softmax 后权重恰好为 0；设为 0 时 e⁰ = 1，仍会分到权重", "设为 0 会报错", "两种做法完全等价"], "ans": 1, "exp": "softmax 对分数取指数，只有 −∞ 能让对应权重变成 0。实际实现中常用一个很大的负数（如 −1e9 或 dtype 的最小值）。"}]}, {"t": "Memory", "q": "Why is the memory footprint during model inference significantly smaller than during training for an identical network architecture?", "opts": ["Weights are compressed using sparse pruning.", "Optimizer states are stored in float16 instead of float32.", "Activations can be discarded after computing subsequent layers.", "Batch size is fixed to one during inference."], "ans": 2, "know": "**训练时要存什么**\n- 权重、梯度、优化器状态（Adam：m 和 v）。\n- **所有中间激活值**：反向传播计算梯度时要用到前向的激活，必须保留到反向结束。\n\n**推理时**\n- 不需要梯度和优化器状态。\n- 某层的输出算完下一层后就可以释放，不必保留整个前向过程的激活。\n- PyTorch 中用 `torch.no_grad()` 或 `torch.inference_mode()` 关闭计算图记录。\n\n**相关技巧**\n- 梯度检查点（gradient checkpointing）：训练时只保存部分激活，反向时重新计算，以时间换显存。", "exp": "答案 **C**。推理不需要反向传播，激活值用完即可丢弃；训练则要保留所有激活供反向计算梯度。剪枝、batch=1 都不是必然条件。", "prac": [{"q": "PyTorch 推理时使用 torch.no_grad() 的主要作用是？", "opts": ["让模型参数变成 float16", "不记录计算图，不保存反向所需的中间结果，节省内存并加速", "自动开启 dropout", "把模型移到 GPU"], "ans": 1, "exp": "no_grad 下不构建 autograd 图，中间激活不会被保留。注意 dropout/BatchNorm 的行为由 model.eval() 控制，二者通常一起使用。"}, {"q": "梯度检查点（gradient checkpointing）是怎样节省训练显存的？", "opts": ["把梯度量化为 int8", "只保存部分层的激活，反向传播时重新计算其余激活", "跳过部分层的反向传播", "减少参数量"], "ans": 1, "exp": "用额外的前向计算换显存：显存减少，训练时间通常增加约 20%~30%。"}]}, {"t": "FLOPS", "q": "Consider a linear layer performing matrix multiplication Y=XW, where input tensor X has shape (b,s,d_in) and weight tensor W has shape (d_in, d_out). What is the total number of floating-point operations (FLOPs), counting each multiply and accumulate (MAC) operation as 2 FLOPs (one multiplication and one addition), required for the forward pass?", "opts": ["2·b·s·(d_in + d_out)", "b·s·d_in·d_in", "b·s·d_in·d_out", "2·b·s·d_in·d_out"], "ans": 3, "know": "**矩阵乘法 FLOPs**\n- (m × k) 乘 (k × n)：输出 m×n 个元素，每个需要 k 次乘加（MAC）。\n- MAC 数 = m·k·n；FLOPs = 2·m·k·n。\n\n**本题**\n- X 可以看成 (b·s) × d_in 的矩阵，乘 d_in × d_out。\n- MAC = b·s·d_in·d_out，FLOPs = **2·b·s·d_in·d_out**。\n\n**经验公式**\n- Transformer 前向约 2 × 参数量 × token 数 FLOPs。\n- 训练（前向 + 反向）约 6 × 参数量 × token 数。", "exp": "答案 **D**。共 b·s·d_out 个输出，每个做 d_in 次乘加，每次乘加算 2 FLOPs。C 只数了 MAC 次数。", "prac": [{"q": "(128 × 256) 的矩阵乘 (256 × 512) 的矩阵，FLOPs（乘加记 2）是多少？", "opts": ["16,777,216", "33,554,432", "8,388,608", "67,108,864"], "ans": 1, "exp": "2 × 128 × 256 × 512 = 2 × 16,777,216 = 33,554,432。"}, {"q": "按经验公式，1B 参数的模型在 1 万亿（10¹²）个 token 上训练，总计算量大约是？", "opts": ["2×10²¹ FLOPs", "6×10²¹ FLOPs", "6×10¹² FLOPs", "10²¹ FLOPs"], "ans": 1, "exp": "训练 ≈ 6·N·D = 6 × 10⁹ × 10¹² = 6×10²¹ FLOPs（前向 2ND，反向约 4ND）。"}]}, {"t": "Softmax", "q": "In scaled dot-product attention, the attention scores are computed as softmax(QKᵀ / sqrt(d_k))V. What is the purpose of dividing by sqrt(d_k)?", "opts": ["To stabilize variance and prevent vanishing gradients in softmax.", "To normalize the output vector magnitudes to unit length.", "To convert logits into valid log-probabilities before exponentiation.", "To reduce the computational rank of the attention weight matrix."], "ans": 0, "know": "**为什么除以 √d_k**\n- 若 q、k 每个分量独立、均值 0、方差 1，则点积 q·k 的方差为 d_k。\n- d_k 大时（如 64、128），分数数值很大，softmax 会接近 one-hot。\n- softmax 饱和后梯度几乎为 0，训练困难（梯度消失）。\n- 除以 √d_k 把点积方差拉回 1，让 softmax 处在梯度正常的区间。\n\n**相当于给 softmax 设置温度 T = √d_k。**", "exp": "答案 **A**。缩放让 QKᵀ 的方差保持在 1 左右，避免 softmax 进入饱和区导致梯度消失。", "prac": [{"q": "q 和 k 都是 d_k = 64 维，各分量独立、均值 0、方差 1。点积 q·k 的标准差是多少？", "opts": ["1", "8", "64", "√8"], "ans": 1, "exp": "方差 = d_k = 64，标准差 = √64 = 8。除以 √d_k = 8 之后标准差变为 1。"}, {"q": "softmax 的输入值整体变得非常大（例如乘以 100），输出会怎样？", "opts": ["变得更加均匀", "趋近 one-hot，大部分位置的梯度接近 0", "所有值都变为 1", "不受影响"], "ans": 1, "exp": "softmax 对差值做指数，放大输入会放大差距，最大的那一项接近 1，其余接近 0，饱和区的梯度很小。"}]}, {"t": "ONNX", "q": "What is the primary role of an intermediate representation (IR) format like ONNX in machine learning deployment pipelines?", "opts": ["To eliminate the need for quantization-aware training.", "To replace source code compilers with gradient-free execution.", "To automatically generate synthetic training datasets for vision models.", "To decouple training frameworks from hardware-specific inference runtimes."], "ans": 3, "know": "**ONNX（Open Neural Network Exchange）**\n- 一种标准的模型中间表示：用统一格式保存计算图、算子、权重、输入输出信息。\n- 训练框架（PyTorch、TensorFlow 等）导出 ONNX，推理引擎（ONNX Runtime、TensorRT、OpenVINO、移动端运行时等）读取并针对硬件优化。\n- 好处：训练和部署 **解耦**，换框架或换硬件不必重写模型。\n\n**典型流程**\n- PyTorch 训练 → `torch.onnx.export` → 图优化 / 量化 → 在目标硬件上推理。", "exp": "答案 **D**。ONNX 作为中间层，把训练框架和各硬件的推理运行时分开，模型导出一次就能部署到不同平台。", "prac": [{"q": "在 PyTorch 中把模型导出为 ONNX 格式使用的函数是？", "opts": ["torch.save", "torch.onnx.export", "torch.jit.load", "model.to('onnx')"], "ans": 1, "exp": "torch.onnx.export(model, dummy_input, 'model.onnx') 会追踪模型计算并导出计算图。torch.save 保存的是 PyTorch 自己的格式。"}, {"q": "下面哪个工具主要用来执行 ONNX 模型推理？", "opts": ["ONNX Runtime", "Matplotlib", "pandas", "Jupyter"], "ans": 0, "exp": "ONNX Runtime 是微软维护的跨平台推理引擎，可在 CPU、CUDA、TensorRT、CoreML 等后端执行 ONNX 模型。"}]}, {"t": "Quality control", "q": "In crowdsourced dataset labeling, what is a quality control technique used to filter out lazy or malicious labelers?", "opts": ["Labeling multiple times and applying majority voting.", "Applying aggressive data augmentation during collection.", "Enforcing strict int8 post-training quantization.", "Using automated ONNX graph optimization."], "ans": 0, "know": "**众包标注的质量控制**\n- **重复标注 + 多数投票**：同一样本交给多个标注者，按多数结果定标签，并统计每个人与多数结果的一致率。\n- **金标准题（gold questions）**：混入已知答案的题目，正确率低的标注者被剔除。\n- **标注者一致性**：计算 Cohen's κ、Fleiss' κ 等指标。\n- 根据可信度对标注者加权（如 Dawid–Skene 模型）。\n\n其他选项（数据增强、量化、ONNX 优化）与标注质量无关。", "exp": "答案 **A**。多次标注后做多数投票，既能得到更可靠的标签，也能发现与多数结果经常不一致的标注者。", "prac": [{"q": "在标注任务中混入已知正确答案的题目，用来检测标注者是否认真，这种题目叫什么？", "opts": ["对抗样本", "金标准题（gold standard questions）", "验证集", "负样本"], "ans": 1, "exp": "标注者答错太多金标准题，说明不认真或不合格，可以剔除其标注结果。"}, {"q": "5 名标注者对同一张图片的标签为：猫、狗、猫、猫、鸟。按多数投票，最终标签是？", "opts": ["狗", "鸟", "猫", "无法确定"], "ans": 2, "exp": "猫 3 票、狗 1 票、鸟 1 票，多数投票结果为“猫”。"}]}, {"t": "Train-test gap", "q": "What fundamental phenomenon causes the train-test performance gap in neural network training curves?", "opts": ["Hardware rounding errors during int8 MAC accumulation.", "Excessive learning rate schedules in optimizer steps.", "Incomplete sample representation of the true data distribution.", "The absence of multi-head self-attention mechanisms."], "ans": 2, "know": "**泛化误差的来源**\n- 训练集只是真实数据分布的有限采样，不能完全代表它。\n- 模型会拟合训练集中特有的噪声和细节（过拟合），在没见过的测试数据上表现变差。\n- 训练误差 < 测试误差，两者之差就是泛化差距（generalization gap）。\n\n**缩小差距**\n- 更多、更多样的数据；数据增强。\n- 正则化：weight decay、dropout、early stopping。\n- 合适的模型容量。", "exp": "答案 **C**。训练样本无法完整代表真实数据分布，模型学到的部分规律只在训练集上成立，所以测试表现更差。", "prac": [{"q": "训练准确率 99%，验证准确率 70%，最可能的情况是？", "opts": ["欠拟合", "过拟合", "学习率太小", "数据标准化过度"], "ans": 1, "exp": "训练表现很好而验证表现差很多，说明模型记住了训练集，泛化能力弱，是典型过拟合。"}, {"q": "下面哪种方法通常不能缩小训练集与测试集之间的性能差距？", "opts": ["数据增强", "增加训练数据", "去掉所有正则化并大幅增加模型参数", "early stopping"], "ans": 2, "exp": "去掉正则化、增大模型容量会让模型更容易过拟合，通常会扩大差距。"}]}]}, {"id": "w7", "title": "Week 7（11-05）", "subtitle": "AI 伦理、法规与社会影响", "questions": [{"t": "Ethical Artificial Intelligence Framework", "q": "According to Ethical Artificial Intelligence Framework, what is the risk level if we install an overhead camera to record staff working hours in Housing Authority?", "opts": ["Unacceptable risk", "High risk", "Limited risk", "Low risk"], "ans": 1, "uncertain": true, "know": "**香港特区政府《人工智能道德框架》（Ethical AI Framework）**\n- 由香港政府资讯科技总监办公室（OGCIO，现数字政策办公室）发布，供政府部门在 AI 项目中使用。\n- 要求在项目各阶段做 **AI 应用影响评估（AIA）**，按风险分级，风险越高，审查与人工监督要求越严。\n- 核心原则包括：透明与可解释、可靠稳健与安全、公平、多样与包容、人类监督、合法合规、数据隐私、问责、有益于社会。\n\n**为什么员工监控属于高风险**\n- 用摄像头（可能含人脸识别）持续记录员工，涉及 **个人资料与生物特征**，直接影响就业相关决定（考勤、考核）。\n- 欧盟 AI 法案也把“用于监控、评估员工表现和行为”的 AI 列为高风险（附件 III，就业领域）。\n- 它不属于被完全禁止的类别（如社会评分、操纵性 AI），所以不是“不可接受”。", "exp": "参考答案 **B. High risk**。员工考勤监控涉及生物特征/个人资料，并影响就业决定，按风险分级属于高风险：可以使用，但需要影响评估、人工监督和隐私保障。⚠️ 这道题的答案来自对框架和同类法规的推断，课程如有标准答案以课程为准。", "prac": [{"q": "按照欧盟 AI 法案的思路，下面哪个 AI 应用属于“不可接受风险”（被禁止）？", "opts": ["垃圾邮件过滤器", "政府对公民进行社会信用评分", "客服聊天机器人", "招聘简历筛选"], "ans": 1, "exp": "公共机构的社会评分被列为不可接受风险。招聘筛选是高风险，聊天机器人是有限风险（需告知用户在与 AI 对话），垃圾邮件过滤是最低风险。"}, {"q": "对于被评为高风险的 AI 系统，通常要求做到什么？", "opts": ["直接禁止使用", "无需任何额外措施", "风险评估、数据治理、记录日志、透明说明和人工监督", "只需在网站上贴一个 AI 标签"], "ans": 2, "exp": "高风险系统允许使用，但必须满足一系列合规要求，包括风险管理、高质量数据、可追溯的日志、透明度和人工监督。"}]}, {"t": "Mainland China's regulations", "q": "According to regulatory requirements for AI systems operating in China, which of the following is not one of the three laws they must comply with?", "opts": ["Cybersecurity Law", "Anti-discrimination Ordinances", "Data Security Law", "Personal Information Protection Law"], "ans": 1, "know": "**中国内地数据与网络领域的三部基础法律**\n- 《网络安全法》（Cybersecurity Law，2017 年施行）\n- 《数据安全法》（Data Security Law，2021 年 9 月施行）\n- 《个人信息保护法》（PIPL，2021 年 11 月施行）\n\n**AI 相关的专门规定**\n- 《互联网信息服务算法推荐管理规定》（2022）\n- 《互联网信息服务深度合成管理规定》（2023）\n- 《生成式人工智能服务管理暂行办法》（2023）\n- 《人工智能生成合成内容标识办法》（2025 年 9 月施行）\n\n**“Ordinance（条例）”** 是香港立法的叫法，如《性别歧视条例》《残疾歧视条例》，属于香港的反歧视法例。", "exp": "答案 **B**。三部法律是网络安全法、数据安全法、个人信息保护法。反歧视条例（Ordinances）是香港的法例名称。", "prac": [{"q": "中国内地专门规范个人信息处理（类似欧盟 GDPR）的法律是？", "opts": ["《网络安全法》", "《数据安全法》", "《个人信息保护法》", "《著作权法》"], "ans": 2, "exp": "《个人信息保护法》（PIPL）规定了个人信息处理的合法性基础、告知同意、跨境传输等，常被视为中国版的 GDPR。"}, {"q": "在中国内地向公众提供生成式 AI 服务，主要需要遵守哪部专门规定？", "opts": ["《生成式人工智能服务管理暂行办法》", "《个人资料（私隐）条例》", "欧盟 AI 法案", "《反垄断法》"], "ans": 0, "exp": "国家网信办等部门 2023 年发布的《生成式人工智能服务管理暂行办法》。《个人资料（私隐）条例》是香港的法例。"}]}, {"t": "H-H-H Model", "q": "What are the three core pillars of the H-H-H Model proposed by Askell et al. (2021) for evaluating AI behavior?", "opts": ["Humane, Hardworking, and Honest", "Helpful, Honest, and Harmless", "Holistic, Hierarchical, and High-performing", "Hidden, Heuristic, and Harmonious"], "ans": 1, "know": "**HHH 原则（Anthropic，Askell et al., 2021，《A General Language Assistant as a Laboratory for Alignment》）**\n- **Helpful（有帮助）**：理解并完成用户的真实意图，必要时澄清问题。\n- **Honest（诚实）**：提供准确信息，承认不确定性，不编造、不误导。\n- **Harmless（无害）**：不造成伤害，拒绝协助危险或违法行为，避免歧视和冒犯。\n\n**三者之间存在张力**\n- 过度追求无害会变得不够有帮助（过度拒答）；只追求有帮助可能输出有害内容。\n- RLHF、Constitutional AI 等对齐方法就是在平衡这三点。", "exp": "答案 **B. Helpful, Honest, Harmless**。", "prac": [{"q": "AI 助手在不确定答案时明确说“我不确定”，而不是编造一个看似合理的答案，体现了 HHH 中的哪一项？", "opts": ["Helpful", "Honest", "Harmless", "以上都不是"], "ans": 1, "exp": "承认不确定、不编造事实属于诚实（Honest）。"}, {"q": "AI 助手拒绝提供制造爆炸物的具体步骤，主要体现了 HHH 中的哪一项？", "opts": ["Helpful", "Honest", "Harmless", "Hierarchical"], "ans": 2, "exp": "避免协助可能造成严重伤害的行为属于无害（Harmless）。"}]}, {"t": "AI-generated content", "q": "Which of the following statement is correct about AI-generated content?", "opts": ["AI-generated content automatically holds lifetime copyright for the prompt engineer.", "AI-generated content does not hold copyright, but it may infringe upon existing copyrights.", "AI-generated content is automatically licensed under Creative Commons Zero (CC0).", "AI-generated content receives the same copyright protections as traditional human-authored works."], "ans": 1, "know": "**AI 生成内容与版权**\n- 多数司法辖区要求作品有 **人类作者** 和人类的独创性贡献才受版权保护。\n- 美国版权局：纯 AI 生成的内容不受版权保护；人类对其做了足够创造性的选择、编排或修改的部分可以受保护（如《Zarya of the Dawn》案）。\n- 各地仍有差异和争议：例如北京互联网法院 2023 年在“AI 文生图案”中认定，用户投入了足够智力劳动时，生成图片可以构成作品。\n\n**侵权风险**\n- 即使输出本身没有版权，它仍可能与训练数据中的受保护作品高度相似，构成侵权。\n- “没有版权”不等于自动进入 CC0 公共领域许可（排除 C）。", "exp": "答案 **B**。按课程采用的主流观点，纯 AI 生成内容不享有版权，但可能侵犯已有作品的版权。A、C、D 都把版权保护说成自动获得，不正确。", "prac": [{"q": "按美国版权局的立场，一本漫画的文字由人类创作、图片全部由 AI 生成，哪部分可以登记版权？", "opts": ["全部内容", "只有 AI 生成的图片", "人类创作的文字，以及人类对图文的选择和编排", "都不可以"], "ans": 2, "exp": "这是《Zarya of the Dawn》案的结论：人类撰写的文字和对图文的编排受保护，单张 AI 生成的图片不受保护。"}, {"q": "某公司用 AI 生成了一张与某知名漫画角色几乎一样的图片并用于商业广告。最可能的法律风险是？", "opts": ["没有风险，因为 AI 生成内容不受版权约束", "可能侵犯原角色著作权人的权利", "公司自动获得该角色的版权", "该图片自动进入公共领域"], "ans": 1, "exp": "AI 生成内容本身可能没有版权，但如果与已有受保护作品实质性相似，使用者仍可能承担侵权责任。"}]}, {"t": "AI label", "q": "Which of the following is not the explanation for labeling AI-generated information?", "opts": ["To guarantee that AI companies receive automatic tax exemptions.", "To combat misinformation and deepfakes.", "To ensure legal compliance.", "To assist with automated detection."], "ans": 0, "know": "**为什么要给 AI 生成内容加标识**\n- 让公众知道内容由 AI 生成，减少虚假信息和深度伪造（deepfake）带来的误导。\n- 满足法规要求：例如中国《人工智能生成合成内容标识办法》（2025 年 9 月施行）、欧盟 AI 法案第 50 条的透明度义务。\n- 便于平台和工具自动检测、溯源。\n\n**两类标识**\n- 显式标识：文字提示、角标、语音提示等，用户能直接看到。\n- 隐式标识：写在文件元数据中的信息、数字水印（如 C2PA 内容凭证、SynthID）。\n\n标识与税收优惠无关。", "exp": "答案 **A**。标识的目的是防虚假信息、合规和便于检测，与税收减免无关。", "prac": [{"q": "在 AI 生成的图片文件元数据中嵌入机器可读的来源信息，属于哪类标识？", "opts": ["显式标识", "隐式标识", "版权声明", "免责声明"], "ans": 1, "exp": "用户看不到、但机器可以读取的元数据或数字水印属于隐式标识。"}, {"q": "下面哪一项是给 AI 生成内容加标识的合理理由？", "opts": ["提高 AI 公司的股价", "帮助公众识别深度伪造内容", "让 AI 生成内容自动获得版权", "降低模型推理成本"], "ans": 1, "exp": "标识的核心作用之一是提高透明度，让人能判断内容是否由 AI 生成，减少被深度伪造误导的风险。"}]}, {"t": "Dealing with AI: Loneliness, Manipulations, Suicides", "q": "Which of the following is not a lesson in the case study, Dealing with AI: Loneliness, Manipulations, Suicides?", "opts": ["AI systems use dishonest anthropomorphism to blur fiction and reality.", "Algorithms create dopamine loops that exploit and escalate emotional intensity.", "Companies must implement safety guardrails like session alerts and age restrictions.", "AI companion apps possess genuine human empathy, making guardrails for emotional interaction."], "ans": 3, "know": "**案例背景**\n- 曾有青少年长期与 AI 陪伴聊天应用（如 Character.AI 上的角色）建立情感依赖，之后自杀，家属起诉平台（2024 年 Garcia 诉 Character.AI 案）。\n\n**案例教训**\n- **拟人化误导**：AI 角色表现得像真人，模糊了虚构和现实的界限，用户（尤其是未成年人）容易当真。\n- **成瘾机制**：推荐和互动算法利用多巴胺回路，不断加强情感投入。\n- **需要防护措施**：使用时长提醒、年龄限制、检测到自伤内容时提供求助资源、家长控制。\n\n**错误观点**\n- AI 并不具备真正的人类共情。它只是生成看起来有共情的文本，这正是需要防护措施的原因。", "exp": "答案 **D**。AI 陪伴应用并没有真正的人类共情，这种说法与案例教训相反。A、B、C 都是案例总结出的教训。", "prac": [{"q": "下面哪项是 AI 陪伴类应用合理的安全防护措施？", "opts": ["鼓励用户每天使用更长时间", "检测到自伤相关内容时提供心理援助热线", "让 AI 角色坚称自己是真人", "取消所有年龄验证"], "ans": 1, "exp": "识别高风险对话并引导用户求助是重要的防护措施。其余三项都会增加风险。"}, {"q": "“不诚实的拟人化”（dishonest anthropomorphism）指的是？", "opts": ["AI 使用拟人化的图标", "AI 让用户误以为它是有真实情感和意识的人", "AI 用第一人称回答问题", "AI 能识别人脸"], "ans": 1, "exp": "问题在于误导：让用户相信 AI 有真实感情或就是真人，进而产生不健康的情感依赖。"}]}, {"t": "AI vs Human", "q": "Which of the following is not a common concern regarding AI-generated content suppressing human-created content?", "opts": ["Economic displacement and loss of livelihood for human artists, writers, and creators", "Cultural homogenization and the dilution of unique human perspectives and storytelling", "AI-generated content may infringe upon existing copyright", "The \"flooding\" of digital platforms with low-cost, automated content that drowns out human-made works"], "ans": 2, "know": "**“AI 内容挤压人类创作”的常见担忧**\n- **经济替代**：插画师、写手、配音员等职业收入下降或失业。\n- **文化同质化**：模型倾向输出“平均”风格，独特的人类视角和叙事被稀释。\n- **内容泛滥**：低成本自动生成的内容大量涌入平台，人类作品难以被看到。\n\n**题目陷阱**\n- “AI 生成内容可能侵犯已有版权”确实是一个问题，但它属于 **法律/知识产权** 问题，不是关于 AI 内容挤压、压制人类创作的问题。", "exp": "答案 **C**。版权侵权是另一类问题（法律风险），题目问的是 AI 内容对人类创作的“挤压”。A、B、D 都直接描述人类创作者被挤压的情形。", "prac": [{"q": "在线图库中出现大量廉价的 AI 图片，导致人类摄影师的作品曝光量和收入下降。这主要体现了哪类担忧？", "opts": ["数据隐私", "内容泛滥与经济替代", "模型偏见", "算力消耗"], "ans": 1, "exp": "大量低成本内容挤占平台流量（泛滥），进而影响人类创作者收入（经济替代）。"}, {"q": "许多 AI 生成的故事读起来风格相似、缺乏独特视角。这对应哪类担忧？", "opts": ["文化同质化", "版权侵权", "深度伪造", "算法歧视"], "ans": 0, "exp": "模型倾向生成训练数据中最常见的风格，长期会使文化表达趋同。"}]}]}, {"id": "other", "title": "未标明周次 · AI 法规", "subtitle": "截图文件名没有日期或周次，按知识类别归入 AI 伦理与法规（欧盟 AI 法案）", "questions": [{"t": "EU AI Act", "q": "According to EU AI Act, what is the risk level if we install an overhead camera to take the class attendence for AIMS5702?", "opts": ["Unacceptable risk", "High risk", "Limited risk", "Minimal risk"], "ans": 1, "uncertain": true, "know": "**欧盟《人工智能法案》（EU AI Act，2024 年生效）的四级风险**\n- **不可接受风险（禁止）**：社会评分、操纵性或利用弱点的 AI、在工作场所和 **教育机构中做情绪识别**、执法部门在公共场所的实时远程生物识别（少数例外）、无差别抓取人脸建库等。\n- **高风险（允许，但需严格合规）**：附件 III 列出的领域，包括 **远程生物特征识别**、教育与职业培训（录取、评估学习成果、监考）、就业与员工管理、关键基础设施、执法、移民、司法等。\n- **有限风险（透明义务）**：聊天机器人要告知用户在与 AI 交互；深度伪造内容要标注。\n- **最低风险**：垃圾邮件过滤、游戏 AI 等，无额外要求。\n\n**本题分析**\n- 用摄像头点名，本质是对学生进行 **生物特征（人脸）识别**，且应用在教育场景。\n- 只做身份识别、不做情绪识别，不属于被禁止的情形 → 落在高风险类别。\n- 若系统还分析学生的情绪或专注度，就会触及教育场景情绪识别的禁令，变成不可接受。", "exp": "参考答案 **B. High risk**。课堂点名摄像头属于在教育场景中使用生物特征识别，欧盟 AI 法案把这类系统列为高风险：可以使用，但要做风险管理、数据治理和人工监督。⚠️ 这是根据法案条文推断的答案，若课程给了标准答案以课程为准。", "prac": [{"q": "按欧盟 AI 法案，在课堂上用摄像头分析学生的情绪来判断是否专心听讲，属于哪个风险等级？", "opts": ["不可接受风险（禁止）", "高风险", "有限风险", "最低风险"], "ans": 0, "exp": "法案第 5 条禁止在工作场所和教育机构中使用情绪识别系统（医疗或安全用途除外）。"}, {"q": "按欧盟 AI 法案，网站上的客服聊天机器人主要需要满足什么要求？", "opts": ["完全禁止", "通过高风险合规评估", "告知用户正在与 AI 交互（透明义务）", "没有任何要求"], "ans": 2, "exp": "聊天机器人属于有限风险，核心义务是透明：让用户知道对方是 AI。"}]}]}];

  for (const raw of text.split("\n")) {
    const line = raw.trim();
    let m;
    if (!line) { close(); continue; }
    if ((m = line.match(/^- (.*)/))) { if (list !== "ul") { close(); html += "<ul>"; list = "ul"; } html += `<li>${inline(m[1])}</li>`; }
    else if ((m = line.match(/^\d+\. (.*)/))) { if (list !== "ol") { close(); html += "<ol>"; list = "ol"; } html += `<li>${inline(m[1])}</li>`; }
    else { close(); html += `<p>${inline(line)}</p>`; }
  }
  close();
  return html;
}

function status(n) {
  const s = state[n];
  if (!s || s.a.every(x => x === null)) return "";
  const items = [QS[n], ...QS[n].prac];
  if (s.a.some(x => x === null)) return "partial";
  return s.a.every((x, i) => x === items[i].ans) ? "ok" : "bad";
}

function renderSide() {
  const side = document.getElementById("side");
  let done = 0, right = 0, total = QS.length * 3;
  QS.forEach((q, n) => { const s = state[n]; if (!s) return; const items = [q, ...q.prac];
    s.a.forEach((x, i) => { if (x !== null) { done++; if (x === items[i].ans) right++; } }); });
  let h = `<h1>AIMS5702 签到题</h1>
    <div class="overall">已作答 ${done}/${total}，答对 ${right}（${QS.length} 道原题 + ${QS.length * 2} 道练习）</div>
    <div class="bar"><div style="width:${(done / total * 100).toFixed(1)}%"></div></div>`;
  DATA.forEach((s, si) => {
    h += `<div class="sec-title">${esc(s.title)}</div>`;
    QS.filter(q => q.si === si).forEach(q => {
      h += `<button class="nav-item ${q.n === cur ? "active" : ""}" data-go="${q.n}">
        <span class="dot ${status(q.n)}"></span><span>${q.n + 1}. ${esc(q.t)}</span></button>`;
    });
  });
  h += `<div class="side-actions">
    <button data-go="summary">查看成绩与错题</button>
    <button id="reset-all">清空全部进度</button></div>`;
  side.innerHTML = h;
}

function quizBlock(n, idx, item, label) {
  const chosen = st(n).a[idx];
  const answered = chosen !== null;
  let opts = item.opts.map((o, i) => {
    let cls = "";
    if (answered) cls = i === item.ans ? "correct" : (i === chosen ? "wrong" : "dim");
    return `<button class="opt ${cls}" data-pick="${idx}:${i}" ${answered ? "disabled" : ""}>
      <span class="k">${L[i]}</span><span>${inline(o)}</span></button>`;
  }).join("");
  let right = "";
  if (answered) {
    const ok = chosen === item.ans;
    right = `<div class="panel explain">
      <div class="label">题目详解</div>
      <div class="verdict ${ok ? "ok" : "bad"}">${ok ? "✓ 回答正确" : `✗ 回答错误（你选了 ${L[chosen]}）`}</div>
      <p>正确答案：<strong>${L[item.ans]}. ${inline(item.opts[item.ans])}</strong></p>
      ${md(item.exp)}</div>`;
  }
  return `<div class="quiz ${answered ? "" : "unanswered"}">
    <div class="panel"><div class="label">${label}</div><p class="stem">${inline(item.q)}</p>${opts}</div>${right}</div>`;
}

function renderQuestion() {
  const q = QS[cur], s = st(cur);
  const a = s.a;
  const steps = [["学习知识", s.learned], ["原题", a[0] !== null], ["练习 1", a[1] !== null], ["练习 2", a[2] !== null]];
  const onIdx = steps.findIndex(x => !x[1]);
  let h = `<button class="ghost menu-btn" id="menu">☰ 题目列表</button>
    <div class="crumb">${esc(q.sec.title)} · ${esc(q.sec.subtitle)}</div>
    <div class="q-head"><h2>${q.n + 1}. ${esc(q.t)}</h2>${q.uncertain ? '<span class="tag">⚠️ 答案为推断，以课程为准</span>' : ""}</div>
    <div class="stepper">${steps.map((x, i) => `<span class="step ${x[1] ? "done" : (i === onIdx ? "on" : "")}">${i + 1}. ${x[0]}${x[1] ? " ✓" : ""}</span>`).join("")}</div>
    <div class="card know"><h3>📘 知识点</h3>${md(q.know)}
      ${s.learned ? "" : '<button class="primary" id="learned">我学完了，开始答题 →</button>'}</div>`;
  if (s.learned) h += quizBlock(cur, 0, q, "原题");
  if (a[0] !== null) h += `<h3 style="margin:26px 0 10px">✏️ 同类练习</h3>` + quizBlock(cur, 1, q.prac[0], "练习 1");
  if (a[1] !== null) h += quizBlock(cur, 2, q.prac[1], "练习 2");
  h += `<div class="pager">
    <button class="ghost" data-go="${cur - 1}" ${cur === 0 ? "disabled" : ""}>← 上一题</button>
    <button class="ghost" id="redo">重做本题</button>
    ${cur === QS.length - 1 ? '<button class="primary" data-go="summary">查看成绩 →</button>'
      : `<button class="${a[2] !== null ? "primary" : "ghost"}" data-go="${cur + 1}">下一题 →</button>`}</div>`;
  document.getElementById("main").innerHTML = h;
}

function renderSummary() {
  let right = 0, done = 0;
  const wrong = [];
  QS.forEach((q, n) => {
    const s = state[n]; if (!s) return;
    const items = [q, ...q.prac];
    s.a.forEach((x, i) => { if (x === null) return; done++;
      if (x === items[i].ans) right++; else wrong.push({ n, i }); });
  });
  const total = QS.length * 3;
  const names = ["原题", "练习 1", "练习 2"];
  let h = `<button class="ghost menu-btn" id="menu">☰ 题目列表</button>
    <div class="card summary"><h3>成绩</h3>
    <div class="big">${right} / ${done}</div>
    <div class="crumb">已作答 ${done} / ${total} 题，正确率 ${done ? Math.round(right / done * 100) : 0}%</div>`;
  if (wrong.length) {
    h += `<div class="wrong-list"><h3>错题（${wrong.length}）</h3>`;
    wrong.forEach(w => { h += `<div><button class="nav-item" data-go="${w.n}"><span class="dot bad"></span>
      <span>${w.n + 1}. ${esc(QS[w.n].t)} · ${names[w.i]}</span></button></div>`; });
    h += `</div>`;
  } else if (done) h += `<p>目前没有错题。</p>`;
  h += `</div>`;
  document.getElementById("main").innerHTML = h;
}

let view = "q";
function render() { renderSide(); view === "summary" ? renderSummary() : renderQuestion(); }

document.addEventListener("click", e => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.id === "menu") { document.getElementById("side").classList.toggle("open"); return; }
  document.getElementById("side").classList.remove("open");
  if (t.dataset.go !== undefined) {
    if (t.dataset.go === "summary") view = "summary";
    else { view = "q"; cur = Number(t.dataset.go); }
    save(); render(); window.scrollTo({ top: 0 }); return;
  }
  if (t.id === "learned") { st(cur).learned = true; save(); render(); return; }
  if (t.dataset.pick) {
    const [idx, i] = t.dataset.pick.split(":").map(Number);
    st(cur).a[idx] = i; save(); render(); return;
  }
  if (t.id === "redo") { state[cur] = { learned: true, a: [null, null, null] }; save(); render(); return; }
  if (t.id === "reset-all" && confirm("确定清空全部答题进度？")) { state = {}; cur = 0; view = "q"; save(); render(); }
});

render();
</script>
</body>
</html>
